name: Generate questions (top-up)

# Keeps the question bank stocked: on a schedule (and on demand) it runs the
# generator in --fill mode, which skips problems that already have enough MCQs
# and generates the rest, writing them to MongoDB. This is the "constantly
# generating" job. Requires OPENAI_API_KEY and MONGODB_KEY repository secrets.

on:
  schedule:
    # Every 6 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      num:
        description: 'MCQs to generate per problem'
        default: '3'
      min_per_problem:
        description: 'Target MCQs each problem should have'
        default: '3'
      limit:
        description: 'Max problems to process this run (0 = all)'
        default: '40'

concurrency:
  group: generate-questions
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    # Skip entirely if the required secret is absent (e.g. on forks).
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'vishnu-alachi123/leetswipe' }}
    defaults:
      run:
        working-directory: backend_question_generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install langchain langchain-openai openai pymongo python-dotenv pydantic

      - name: Top up question bank
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_KEY: ${{ secrets.MONGODB_KEY }}
        run: |
          if [ -z "$MONGODB_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing OPENAI_API_KEY or MONGODB_KEY secret; skipping generation."
            exit 0
          fi
          python generate.py --from-db --fill \
            --num "${{ github.event.inputs.num || '3' }}" \
            --min-per-problem "${{ github.event.inputs.min_per_problem || '3' }}" \
            --limit "${{ github.event.inputs.limit || '40' }}"
