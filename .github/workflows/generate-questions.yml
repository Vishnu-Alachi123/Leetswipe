name: Generate questions (top-up)

# Keeps the question bank stocked ("constantly generating"). Two targets:
#   db     — top up MongoDB in --fill mode (skips already-stocked problems).
#            Needs MONGODB_KEY + an LLM key.
#   bundle — regenerate the app's bundled deck (LeetSwipe/assets/data/questions.json)
#            and commit it, which auto-triggers the web deploy. Needs only an
#            LLM key — no database or hosting required.
# LLM key: ANTHROPIC_API_KEY (preferred, claude-opus-4-8) or OPENAI_API_KEY —
# the generator auto-selects the provider from whichever secret is set.

on:
  schedule:
    # Daily. The deck converges on --min-per-problem and then costs nothing, so
    # running more often just adds commits without adding questions any sooner.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to write questions'
        type: choice
        options: [bundle, db]
        default: 'bundle'
      num:
        description: 'MCQs to generate per problem'
        default: '3'
      limit:
        description: 'Max problems to process this run (0 = all) — the per-run cost cap'
        default: '40'
      min_per_problem:
        description: 'Target questions per problem. Runs are free no-ops once every problem reaches it; raise it to grow the deck.'
        default: '6'
      model:
        description: 'Model override (blank = provider default)'
        default: ''

concurrency:
  group: generate-questions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'vishnu-alachi123/leetswipe' }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend_question_generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic langchain langchain-openai openai pymongo python-dotenv pydantic

      - name: Top up MongoDB question bank
        if: ${{ github.event.inputs.target == 'db' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_KEY: ${{ secrets.MONGODB_KEY }}
        run: |
          if [ -z "$MONGODB_KEY" ] || { [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; }; then
            echo "Missing MONGODB_KEY or an LLM key secret; skipping DB top-up."
            exit 0
          fi
          python generate.py --neetcode --fill --fill-source db \
            --num "${{ github.event.inputs.num || '3' }}" \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            --min-per-problem "${{ github.event.inputs.min_per_problem || '6' }}" \
            ${{ github.event.inputs.model && format('--model {0}', github.event.inputs.model) || '' }}

      - name: Regenerate bundled deck
        if: ${{ github.event.inputs.target == 'bundle' || !github.event.inputs.target }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing ANTHROPIC_API_KEY / OPENAI_API_KEY secret; cannot generate."
            exit 1
          fi
          # --fill + --fill-source bundle: read current stock from the committed
          # deck, work on the thinnest problems first, and MERGE the result in.
          # Without --fill this step would regenerate the same first N problems
          # every run and overwrite the deck with just those.
          python generate.py --neetcode --dry-run --fill --fill-source bundle \
            --num "${{ github.event.inputs.num || '3' }}" \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            --min-per-problem "${{ github.event.inputs.min_per_problem || '6' }}" \
            --out /tmp/generated.json \
            --app-out ../LeetSwipe/assets/data/questions.json \
            ${{ github.event.inputs.model && format('--model {0}', github.event.inputs.model) || '' }}

      - name: Commit bundled deck
        if: ${{ github.event.inputs.target == 'bundle' }}
        working-directory: .
        run: |
          if git diff --quiet LeetSwipe/assets/data/questions.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LeetSwipe/assets/data/questions.json
          git commit -m "Regenerate bundled question deck"
          git push
